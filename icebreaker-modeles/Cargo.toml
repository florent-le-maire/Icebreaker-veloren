# Icebreaker : nos modèles voxel, générés par du code (docs/icebreaker/PLAN-PLAYTEST.md, F.23 à F.25).
# `cargo run -p icebreaker-modeles [dossier d'images]` depuis la racine du dépôt écrit les `.vox` dans
# assets/voxygen/voxel/sprite/icebreaker/ (et une image de contrôle par modèle si un dossier est donné).
[package]
name = "icebreaker-modeles"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
dot_vox = "5.1"
image = { workspace = true }
