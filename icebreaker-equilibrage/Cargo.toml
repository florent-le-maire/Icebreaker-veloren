# Icebreaker : le classeur d'équilibrage (jalon EQ, docs/icebreaker/PLAN-PLAYTEST.md, § 8).
# `cargo run -p icebreaker-equilibrage` depuis la racine du dépôt écrit docs/icebreaker/equilibrage.xlsx.
[package]
name = "icebreaker-equilibrage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
rust_xlsxwriter = "0.82"
ron = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
vek = { workspace = true }
# Les chiffres se lisent avec les structures du jeu : mêmes valeurs, et une erreur de compilation si un format change.
common = { package = "veloren-common", path = "../common" }
world = { package = "veloren-world", path = "../world" }
