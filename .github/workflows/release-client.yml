# Icebreaker : Release du client à télécharger, Windows et Mac (PLAN.md, S.5, S.6).
#
# - Numéro changé dans assets/icebreaker/version.ron et poussé sur master : Release « v<version> » (étiquette
#   créée sur ce commit), sauf si elle existe déjà.
# - Étiquette `v*` poussée à la main (ex. `git tag v0.1 && git push origin v0.1`) : Release « v0.1 ».
# - Bouton « Run workflow » (onglet Actions) : pré-release « dernier-build », remplacée à chaque lancement.
#
# Chaque zip contient le jeu, ses assets et un lanceur (Icebreaker.bat / Icebreaker.command) ; au menu, seul le
# bouton « En ligne » (serveur du VPS) est proposé. Le paquet est fait par icebreaker-serveur/paquet-client.sh.
# Le serveur du VPS doit venir du même commit que le client (docs/icebreaker/MAINTENANCE.md, § 3).
name: Release du client

on:
  push:
    branches: [master]
    paths: [assets/icebreaker/version.ron]
    tags: ["v*"] # le filtre de chemins ne s'applique pas aux étiquettes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-client
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Quelle Release faire, et s'il faut en faire une (version.ron touché sans changer le numéro : rien).
  version:
    runs-on: ubuntu-latest
    outputs:
      etiquette: ${{ steps.v.outputs.etiquette }}
      publier: ${{ steps.v.outputs.publier }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            etiquette=dernier-build
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            etiquette="$GITHUB_REF_NAME"
          else
            version=$(sed -n 's/^ *version: *"\([^"]*\)".*/\1/p' assets/icebreaker/version.ron | head -n 1)
            [ -n "$version" ] || { echo "pas de version dans assets/icebreaker/version.ron" >&2; exit 1; }
            etiquette="v$version"
          fi
          publier=true
          if [ "$GITHUB_REF_TYPE" != tag ] && [ "$etiquette" != dernier-build ] &&
              git ls-remote --exit-code --tags origin "refs/tags/$etiquette" > /dev/null; then
            echo "La Release $etiquette existe déjà : changer le numéro de assets/icebreaker/version.ron."
            publier=false
          fi
          echo "etiquette=$etiquette" >> "$GITHUB_OUTPUT"
          echo "publier=$publier" >> "$GITHUB_OUTPUT"
          echo "Release : $etiquette (publier : $publier)"

  client:
    needs: version
    if: needs.version.outputs.publier == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            systeme: windows
          - os: macos-latest # Apple Silicon
            systeme: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      # Les assets sont dans Git LFS (~440 Mo) : gardés en cache pour ménager le quota de bande passante LFS.
      - name: Liste des fichiers LFS
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
          enableCrossOsArchive: true
      - name: Assets LFS
        run: git lfs pull

      # shaderc-sys se compile depuis ses sources : CMake (déjà là) et Ninja.
      - name: Ninja (Mac)
        if: matrix.systeme == 'mac'
        run: brew install ninja
      - name: Ninja (Windows)
        if: matrix.systeme == 'windows'
        run: choco install ninja --no-progress -y

      # La chaîne Rust est celle du fichier rust-toolchain (rustup est déjà sur les runners).
      - name: Chaîne Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: client-release

      - name: Compilation du client
        run: cargo build --release -p veloren-voxygen

      - name: Paquet
        run: sh icebreaker-serveur/paquet-client.sh "target/Icebreaker-${{ matrix.systeme }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Icebreaker-${{ matrix.systeme }}
          path: target/Icebreaker-${{ matrix.systeme }}.zip
          compression-level: 0
          retention-days: 7

  # Publie les zips présents, même si un système a échoué (ex. pas de Mac libre chez GitHub) : « Re-run failed
  # jobs » sur le run ajoute ensuite le zip manquant à la même Release.
  release:
    needs: [version, client]
    if: always() && needs.version.result == 'success' && needs.version.outputs.publier == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ETIQUETTE: ${{ needs.version.outputs.etiquette }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true # aucun zip : l'étape suivante échoue avec un message clair
        with:
          path: zips
          merge-multiple: true

      - name: Release
        run: |
          ls zips/*.zip > /dev/null 2>&1 || { echo "Aucun zip : Windows et Mac ont échoué." >&2; exit 1; }
          etiquette="$ETIQUETTE"
          if [ "$etiquette" = dernier-build ]; then
            titre="Icebreaker, dernier build (${GITHUB_SHA::10})"; pre="--prerelease"
          else
            titre="Icebreaker $etiquette"; pre=""
          fi
          {
            echo "Client Icebreaker du commit ${GITHUB_SHA::10}. Au menu, le bouton **En ligne** rejoint le serveur de l'équipe."
            echo
            if [ -f zips/Icebreaker-windows.zip ]; then
              echo '- **Windows** : dézipper `Icebreaker-windows.zip`, lancer `Icebreaker.bat`.'
            else
              echo '- **Windows** : zip pas encore là (build échoué, à relancer).'
            fi
            if [ -f zips/Icebreaker-mac.zip ]; then
              echo '- **Mac (Apple Silicon, M1 et suivants)** : dézipper `Icebreaker-mac.zip`. Le jeu n'"'"'est pas signé : la'
              echo '  première fois, dans le Terminal, `xattr -dr com.apple.quarantine <dossier Icebreaker>`, puis double-cliquer'
              echo '  `Icebreaker.command`.'
            else
              echo '- **Mac** : zip pas encore là (pas de Mac libre chez GitHub ou build échoué, à relancer).'
            fi
          } > notes.md
          cat notes.md
          if [ "$etiquette" != dernier-build ] && gh release view "$etiquette" > /dev/null 2>&1; then
            # Relance d'un système manquant : on complète la Release existante.
            gh release upload "$etiquette" zips/*.zip --clobber
            gh release edit "$etiquette" --notes-file notes.md
          else
            [ "$etiquette" = dernier-build ] && { gh release delete "$etiquette" --cleanup-tag --yes || true; }
            gh release create "$etiquette" zips/*.zip --target "$GITHUB_SHA" --title "$titre" --notes-file notes.md $pre
          fi
