# Icebreaker : Release du client à télécharger, Windows et Mac (PLAN.md, S.5, S.6).
#
# - Numéro changé dans assets/icebreaker/version.ron et poussé sur master : Release « v<version> » (étiquette
#   créée sur ce commit), sauf si elle existe déjà.
# - Étiquette `v*` poussée à la main (ex. `git tag v0.1 && git push origin v0.1`) : Release « v0.1 ».
# - Bouton « Run workflow » (onglet Actions) : pré-release « dernier-build », remplacée à chaque lancement.
#
# Chaque zip contient le jeu, ses assets et un lanceur (Icebreaker.bat / Icebreaker.command) ; au menu, seul le
# bouton « En ligne » (serveur du VPS) est proposé. Le paquet est fait par icebreaker-serveur/paquet-client.sh.
# Le serveur du VPS doit venir du même commit que le client (docs/icebreaker/MAINTENANCE.md, § 3) : pour une
# version (pas pour « dernier-build »), le job `serveur` le compile pour le VPS (ARM64) et le job `deployer`
# l'y envoie après la Release, par icebreaker-serveur/deployer.sh (S.8). Secrets de l'environnement GitHub
# « vps » : VPS_HOTE (root@<ip>), VPS_CLE_SSH (clé privée), VPS_KNOWN_HOSTS (sortie de ssh-keyscan <ip>).
name: Release du client

on:
  push:
    branches: [master]
    paths: [assets/icebreaker/version.ron]
    tags: ["v*"] # le filtre de chemins ne s'applique pas aux étiquettes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-client
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Quelle Release faire, et s'il faut en faire une (version.ron touché sans changer le numéro : rien).
  version:
    runs-on: ubuntu-latest
    outputs:
      etiquette: ${{ steps.v.outputs.etiquette }}
      publier: ${{ steps.v.outputs.publier }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            etiquette=dernier-build
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            etiquette="$GITHUB_REF_NAME"
          else
            version=$(sed -n 's/^ *version: *"\([^"]*\)".*/\1/p' assets/icebreaker/version.ron | head -n 1)
            [ -n "$version" ] || { echo "pas de version dans assets/icebreaker/version.ron" >&2; exit 1; }
            etiquette="v$version"
          fi
          publier=true
          if [ "$GITHUB_REF_TYPE" != tag ] && [ "$etiquette" != dernier-build ] &&
              git ls-remote --exit-code --tags origin "refs/tags/$etiquette" > /dev/null; then
            echo "La Release $etiquette existe déjà : changer le numéro de assets/icebreaker/version.ron."
            publier=false
          fi
          echo "etiquette=$etiquette" >> "$GITHUB_OUTPUT"
          echo "publier=$publier" >> "$GITHUB_OUTPUT"
          echo "Release : $etiquette (publier : $publier)"

  client:
    needs: version
    if: needs.version.outputs.publier == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            systeme: windows
          - os: macos-latest # Apple Silicon
            systeme: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      # Les assets sont dans Git LFS (~440 Mo) : gardés en cache pour ménager le quota de bande passante LFS.
      - name: Liste des fichiers LFS
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
          enableCrossOsArchive: true
      - name: Assets LFS
        run: git lfs pull

      # shaderc-sys se compile depuis ses sources : CMake (déjà là) et Ninja.
      - name: Ninja (Mac)
        if: matrix.systeme == 'mac'
        run: brew install ninja
      - name: Ninja (Windows)
        if: matrix.systeme == 'windows'
        run: choco install ninja --no-progress -y

      # La chaîne Rust est celle du fichier rust-toolchain (rustup est déjà sur les runners).
      - name: Chaîne Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: client-release

      - name: Compilation du client
        run: cargo build --release -p veloren-voxygen

      - name: Paquet
        run: sh icebreaker-serveur/paquet-client.sh "target/Icebreaker-${{ matrix.systeme }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Icebreaker-${{ matrix.systeme }}
          path: target/Icebreaker-${{ matrix.systeme }}.zip
          compression-level: 0
          retention-days: 7

  # Icebreaker S.8 : le serveur du VPS (ARM64 Debian 12), même recette que icebreaker-serveur/compiler-vps.sh.
  # Ubuntu 22.04 et pas ubuntu-latest : sa glibc (2.35) ne doit pas dépasser celle de Debian 12 (2.36).
  serveur:
    needs: version
    if: needs.version.outputs.publier == 'true' && needs.version.outputs.etiquette != 'dernier-build'
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      CARGO_TERM_COLOR: always
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
    steps:
      - uses: actions/checkout@v4 # sans LFS : la compilation n'a pas besoin des assets

      # .cargo/config.toml : éditeur de liens aarch64-linux-gnu-gcc avec -fuse-ld=mold ; le gcc croisé
      # cherche mold sous le nom aarch64-linux-gnu-ld.mold.
      - name: Outils de compilation croisée
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-aarch64-linux-gnu g++-aarch64-linux-gnu mold cmake clang
          sudo ln -sf "$(command -v mold)" /usr/bin/aarch64-linux-gnu-ld.mold

      - name: Chaîne Rust
        run: |
          rustup toolchain install
          rustup target add aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: serveur-vps

      - name: Compilation du serveur
        run: cargo build --release --target aarch64-unknown-linux-gnu -p veloren-server-cli --features plugins

      - uses: actions/upload-artifact@v4
        with:
          name: veloren-server-cli-vps
          path: target/aarch64-unknown-linux-gnu/release/veloren-server-cli
          retention-days: 7

  # Publie les zips présents, même si un système a échoué (ex. pas de Mac libre chez GitHub) : « Re-run failed
  # jobs » sur le run ajoute ensuite le zip manquant à la même Release.
  release:
    needs: [version, client]
    if: always() && needs.version.result == 'success' && needs.version.outputs.publier == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ETIQUETTE: ${{ needs.version.outputs.etiquette }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true # aucun zip : l'étape suivante échoue avec un message clair
        with:
          path: zips
          pattern: Icebreaker-* # les zips, pas le serveur du VPS
          merge-multiple: true

      - name: Release
        run: |
          ls zips/*.zip > /dev/null 2>&1 || { echo "Aucun zip : Windows et Mac ont échoué." >&2; exit 1; }
          etiquette="$ETIQUETTE"
          if [ "$etiquette" = dernier-build ]; then
            titre="Icebreaker, dernier build (${GITHUB_SHA::10})"; pre="--prerelease"
          else
            titre="Icebreaker $etiquette"; pre=""
          fi
          {
            echo "Client Icebreaker du commit ${GITHUB_SHA::10}. Au menu, le bouton **En ligne** rejoint le serveur de l'équipe."
            echo
            if [ -f zips/Icebreaker-windows.zip ]; then
              echo '- **Windows** : dézipper `Icebreaker-windows.zip`, lancer `Icebreaker.bat`.'
            else
              echo '- **Windows** : zip pas encore là (build échoué, à relancer).'
            fi
            if [ -f zips/Icebreaker-mac.zip ]; then
              echo '- **Mac (Apple Silicon, M1 et suivants)** : dézipper `Icebreaker-mac.zip`. Le jeu n'"'"'est pas signé : la'
              echo '  première fois, dans le Terminal, `xattr -dr com.apple.quarantine <dossier Icebreaker>`, puis double-cliquer'
              echo '  `Icebreaker.command`.'
            else
              echo '- **Mac** : zip pas encore là (pas de Mac libre chez GitHub ou build échoué, à relancer).'
            fi
          } > notes.md
          cat notes.md
          if [ "$etiquette" != dernier-build ] && gh release view "$etiquette" > /dev/null 2>&1; then
            # Relance d'un système manquant : on complète la Release existante.
            gh release upload "$etiquette" zips/*.zip --clobber
            gh release edit "$etiquette" --notes-file notes.md
          else
            [ "$etiquette" = dernier-build ] && { gh release delete "$etiquette" --cleanup-tag --yes || true; }
            gh release create "$etiquette" zips/*.zip --target "$GITHUB_SHA" --title "$titre" --notes-file notes.md $pre
          fi

  # Icebreaker S.8 : une fois la Release publiée (même avec un seul zip), le serveur du même commit part sur le
  # VPS. Les personnages du VPS restent ; le service icebreaker-veloren@campagne est relancé.
  deployer:
    needs: [version, serveur, release]
    if: >-
      always() && needs.serveur.result == 'success' && needs.release.result == 'success' &&
      needs.version.outputs.etiquette != 'dernier-build'
    runs-on: ubuntu-latest
    environment: vps
    concurrency:
      group: deployer-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # deployer.sh envoie assets/common, server, world et icebreaker, dont des fichiers LFS (même cache que les
      # clients).
      - name: Liste des fichiers LFS
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
          enableCrossOsArchive: true
      - name: Assets LFS
        run: git lfs pull --include "assets/common/**,assets/server/**,assets/world/**,assets/icebreaker/**"

      - uses: actions/download-artifact@v4
        with:
          name: veloren-server-cli-vps
          path: target/vps

      - name: Clé SSH du VPS
        env:
          VPS_CLE_SSH: ${{ secrets.VPS_CLE_SSH }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          [ -n "$VPS_CLE_SSH" ] && [ -n "$VPS_KNOWN_HOSTS" ] ||
            { echo "Secrets VPS_CLE_SSH / VPS_KNOWN_HOSTS absents (environnement « vps »)." >&2; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_CLE_SSH" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Déploiement
        env:
          VPS_HOTE: ${{ secrets.VPS_HOTE }}
        run: |
          [ -n "$VPS_HOTE" ] || { echo "Secret VPS_HOTE absent (environnement « vps »)." >&2; exit 1; }
          BINAIRE="$PWD/target/vps/veloren-server-cli" sh icebreaker-serveur/deployer.sh "$VPS_HOTE"
